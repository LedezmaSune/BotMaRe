version: '3.8'

services:
  botmare:
    build: .
    container_name: botmare_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
