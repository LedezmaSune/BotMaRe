version: '3.8'

services:
  botmare:
    build: .
    container_name: botmare_engine
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./auth_info_baileys:/app/auth_info_baileys
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
    # If using tailscale or similar, you might need extra capabilities:
    # cap_add:
    #   - NET_ADMIN
